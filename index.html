  /* ============ Design tokens ============ */
  :root {
    --paper: #faf6ef;
    --surface: #ffffff;
    --ink: #211a12;
    --muted: #7d7164;
    --line: #e8dfd0;
    --accent: #c44b28;
    --accent-ink: #ffffff;
    --accent-soft: #f9e9e1;
    --serif: "Noto Serif SC", Georgia, "Songti SC", "SimSun", serif;
    --sans: "Noto Sans SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    --shadow: 0 1px 2px rgba(33, 26, 18, .05);
  }
  [data-theme="dark"] {
    --paper: #16130e;
    --surface: #201b13;
    --ink: #ece3d3;
    --muted: #9d9080;
    --line: #322b20;
    --accent: #ff7a50;
    --accent-ink: #1c130c;
    --accent-soft: #33231a;

  html { scroll-behavior: smooth; }
  body {

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 24px; }

  /* ============ Masthead ============ */
  .masthead {
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: none;
  }
  .masthead .wrap {
    display: flex; align-items: center; gap: 20px;
    height: 68px;
  }
  .site-title {
    font-family: var(--serif);
    font-size: 22px; font-weight: 900; letter-spacing: .02em;

  }
  .site-title .dot { color: var(--accent); }
  .site-sub {
    font-size: 12px; color: var(--muted); letter-spacing: .14em;
    text-transform: uppercase; margin-top: 2px;

  .nav a {
    font-size: 14px; font-weight: 500; color: var(--muted);
    padding: 8px 12px; border-radius: 6px;
    transition: color .15s ease, background .15s ease;
  }
  .nav a:hover, .nav a.active { color: var(--ink); background: var(--accent-soft); }
  .nav a.active { color: var(--accent); font-weight: 700; }
  .theme-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); display: grid; place-items: center;
    margin-left: 10px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .theme-btn:hover { border-color: var(--accent); transform: rotate(15deg); }
  .theme-btn svg { width: 18px; height: 18px; }
  .icon-sun { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }

  /* ============ Featured ============ */
  .featured { padding: 64px 0 48px; border-bottom: 1px solid var(--line); }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--accent);
  }
  .kicker::before { content: ""; width: 28px; height: 2px; background: var(--accent); }
  .featured h1 {
    font-family: var(--serif);
    font-size: clamp(30px, 4.6vw, 46px);
    font-weight: 900; line-height: 1.28;
    margin: 18px 0 16px; max-width: 20em;
    text-wrap: balance;
  }
  .featured .excerpt {
    font-size: 16.5px; color: var(--muted); max-width: 38em;
  }
  .meta-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    margin-top: 22px; font-size: 13px; color: var(--muted);
  }
  .meta-row .sep { opacity: .5; }
  .read-link {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 26px; padding: 11px 22px;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 8px;
    font-size: 14.5px; font-weight: 700;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .read-link:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -6px var(--accent); }
  .read-link .arrow { transition: transform .15s ease; }
  .read-link:hover .arrow { transform: translateX(3px); }

  /* ============ Main grid ============ */
  .grid {
    display: grid; grid-template-columns: 1fr 272px; gap: 56px;
    padding: 48px 0 72px;
  }

  /* ---- Filter ---- */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .pill {
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 500;
    padding: 6px 15px; border-radius: 999px;
    transition: all .15s ease;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .section-label {
    font-size: 13px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
    margin: 26px 0 4px;
  }

  /* ---- Post list ---- */
  .post-list { list-style: none; }
  .post-item {
    display: grid; grid-template-columns: 96px 1fr; gap: 20px;
    padding: 22px 8px; border-bottom: 1px solid var(--line);
    cursor: pointer; border-radius: 8px 8px 0 0;
    transition: background .15s ease;
    animation: rise .3s ease both;
  }
  .post-item:first-of-type { border-top: 1px solid var(--line); }
  .post-item:hover { background: var(--surface); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .post-date {
    font-size: 13px; color: var(--muted); padding-top: 3px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .post-title {
    font-family: var(--serif); font-size: 19.5px; font-weight: 700;
    line-height: 1.4; transition: color .15s ease;
  }
  .post-item:hover .post-title { color: var(--accent); }
  .post-excerpt {

  .tag {

  .readtime { font-size: 12px; color: var(--muted); align-self: center; }
  .empty-note { padding: 40px 0; color: var(--muted); font-size: 14px; display: none; }

  /* ---- Sidebar ---- */
  .sidebar { display: flex; flex-direction: column; gap: 36px; }
  .side-block h3 {
    font-size: 13px; font-weight: 700; letter-spacing: .14em;

    display: grid; place-items: center;

    margin-bottom: 12px;

  .about-card p { font-size: 13.5px; color: var(--muted); }
  .cat-list { list-style: none; }
  .cat-list li { display: flex; justify-content: space-between; padding: 9px 2px; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .cat-list li:last-child { border-bottom: none; }
  .cat-list button { background: none; border: none; color: var(--ink); font-size: 14px; transition: color .15s; }
  .cat-list button:hover { color: var(--accent); }
  .cat-list .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .reader {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper);
    overflow-y: auto;
    opacity: 0; visibility: hidden;
    transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s;

  .reader.open { opacity: 1; visibility: visible; transform: none; }
  .reader .wrap { max-width: 720px; padding-top: 40px; padding-bottom: 96px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-size: 13.5px; font-weight: 500;
    padding: 8px 18px; margin-bottom: 40px;

  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .reader .kicker { margin-bottom: 4px; }
  .reader h1 {
    font-family: var(--serif); font-size: clamp(28px, 4vw, 40px);

  .reader .body { font-family: var(--serif); font-size: 17px; line-height: 1.95; margin-top: 34px; }
  .reader .body p { margin-bottom: 1.4em; text-wrap: pretty; }
  .reader .body p:first-child::first-letter {
    font-size: 2.6em; font-weight: 900; float: left;
    line-height: 1; padding: 4px 10px 0 0; color: var(--accent);

  /* ============ Footer ============ */
  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-size: 13px; color: var(--muted); }
  footer a { color: var(--accent); font-weight: 500; }
  footer a:hover { text-decoration: underline; }

  /* ============ Responsive ============ */
  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; gap: 40px; }
    .sidebar { flex-direction: row; flex-wrap: wrap; }
    .side-block { flex: 1 1 240px; }
  }
  @media (max-width: 640px) {
    .masthead .wrap { height: auto; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
    .site-sub { display: none; }
    .nav { margin-left: 0; width: 100%; order: 3; justify-content: flex-start; }
    .featured { padding: 44px 0 36px; }
    .post-item { grid-template-columns: 1fr; gap: 6px; }
    .post-date { order: 2; margin-top: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

      "最近反复循环偶像歌曲时冒出一个念头：「闪耀感」能被量化吗？抱着玩的心态拆了几首，发现确实有规律可循。",
      "首先是速度。让人想跟着跳的偶像曲 BPM 大多落在 160 到 180 之间，这个区间恰好接近人在兴奋状态下的心率两倍，身体会本能地跟着动。",
      "其次是和弦。日系偶像曲大量使用四级起始的进行（IV-V-iii-vi），这种进行自带「向前奔跑」的推进感，而且副歌几乎都从大调和弦开始——情绪一下子被点亮。",
      "最妙的是留白。很多神曲在最后一句副歌前会突然抽空所有乐器半拍，只留人声，然后全场乐器砸回来。那半拍的寂静，就是台下所有人屏住呼吸的瞬间。闪耀感，原来是精心设计的心跳。"
    ]
  },
  {
    id: 6,
    title: "我的第一篇博客：为什么要开始写东西",
    date: "2026-06-21",
    tag: "blog", tagLabel: "随笔",
    minutes: 3,
    excerpt: "收藏夹里躺了几百篇别人的文章，却从没留下自己的。今天决定开始写：不为流量，只为把散落的想法钉在时间上。",
    body: [
      "建博客这个念头在脑子里转了快一年。每次看完一篇好文章就想「我也要写」，然后打开游戏，念头就散了。",
      "促使我动手的是一件小事：半年前我解决过一个技术难题，当时的思路全在脑子里，没记录。上个月遇到类似问题，我盯着屏幕完全想不起自己当时是怎么解的。那一刻意识到，不写下来的思考等于没发生。",
      "所以这个博客的定位很简单：技术笔记、翻译心得、追星随笔，想到什么写什么。不追热点，不焦虑阅读量。把散落的想法钉在时间上，未来的我会感谢现在的我。",
      "如果你也是从第一篇开始的，欢迎一起坚持。"
    ]
  }
];

const TAGS = [
  { key: "all", label: "全部" },
  { key: "tech", label: "技术" },
  { key: "translation", label: "翻译" },
  { key: "idol", label: "偶像" },
  { key: "blog", label: "随笔" }
];

/* ================= State ================= */
let activeTag = "all";

const $ = (s) => document.querySelector(s);
const fmtDate = (d) => {
  const [y, m, day] = d.split("-");
  return `${y}.${m}.${day}`;
};

/* ================= Theme ================= */
const savedTheme = localStorage.getItem("blog-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#themeToggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("blog-theme", next);
});

/* ================= Featured ================= */
const featured = posts[0];
function renderFeatured() {
  $("#feat-title").textContent = featured.title;
  $("#feat-excerpt").textContent = featured.excerpt;
  $("#feat-meta").innerHTML =
    `<span>${fmtDate(featured.date)}</span><span class="sep">·</span>` +
    `<span>${featured.tagLabel}</span><span class="sep">·</span>` +
    `<span>约 ${featured.minutes} 分钟</span>`;
  $("#feat-read").onclick = () => openReader(featured.id);
}

/* ================= Filter bar ================= */
function renderFilters() {
  const bar = $("#filterBar");
  bar.innerHTML = TAGS.map(t =>
    `<button class="pill${t.key === activeTag ? " active" : ""}" data-tag="${t.key}" role="tab" aria-selected="${t.key === activeTag}">${t.label}</button>`
  ).join("");
  bar.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTag = btn.dataset.tag;
      renderFilters();
      renderList();
    });
  });
}

/* ================= Post list ================= */
function renderList() {
  const list = $("#postList");
  const filtered = activeTag === "all" ? posts : posts.filter(p => p.tag === activeTag);
  $("#postCount").textContent = `(${filtered.length})`;
  $("#emptyNote").style.display = filtered.length ? "none" : "block";
  list.innerHTML = filtered.map((p, i) => `
    <li class="post-item" data-id="${p.id}" style="animation-delay:${i * 40}ms" tabindex="0" role="button" aria-label="阅读：${p.title}">
      <span class="post-date">${fmtDate(p.date)}</span>
      <div>
        <h2 class="post-title">${p.title}</h2>
        <p class="post-excerpt">${p.excerpt}</p>
        <div class="post-tags">
          <span class="tag">${p.tagLabel}</span>
          <span class="readtime">约 ${p.minutes} 分钟</span>
        </div>
      </div>
    </li>`).join("");
  list.querySelectorAll(".post-item").forEach(item => {
    const open = () => openReader(Number(item.dataset.id));
    item.addEventListener("click", open);
    item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
}

/* ================= Sidebar categories ================= */
function renderCats() {
  const counts = {};
  posts.forEach(p => counts[p.tagLabel] = (counts[p.tagLabel] || 0) + 1);
  $("#catList").innerHTML = Object.entries(counts).map(([name, n]) => `
    <li><button data-cat="${name}">${name}</button><span class="count">${n}</span></li>`).join("");
  $("#catList").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = TAGS.find(x => x.label === btn.dataset.cat);
      activeTag = t ? t.key : "all";
      renderFilters(); renderList();
      document.getElementById("posts").scrollIntoView({ behavior: "smooth" });
    });
  });
}

/* ================= Reader ================= */
function openReader(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  $("#reader-tag").textContent = p.tagLabel;
  $("#reader-title").textContent = p.title;
  $("#reader-meta").innerHTML =
    `<span>${fmtDate(p.date)}</span><span class="sep">·</span>` +
    `<span>约 ${p.minutes} 分钟阅读</span>`;
  $("#reader-body").innerHTML = p.body.map(t => `<p>${t}</p>`).join("");
  $("#reader").classList.add("open");
  $("#reader").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeReader(e) {
  if (e) e.preventDefault();
  $("#reader").classList.remove("open");
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });

/* ================= Init ================= */
renderFeatured();
renderFilters();
renderList();
renderCats();
</script>
</body>
</html>
