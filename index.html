      "建博客这个念头在脑子里转了快一年。每次看完一篇好文章就想「我也要写」，然后打开游戏，念头就散了。",
      "促使我动手的是一件小事：半年前我解决过一个技术难题，当时的思路全在脑子里，没记录。上个月遇到类似问题，我盯着屏幕完全想不起自己当时是怎么解的。那一刻意识到，不写下来的思考等于没发生。",
      "所以这个博客的定位很简单：技术笔记、翻译心得、追星随笔，想到什么写什么。不追热点，不焦虑阅读量。把散落的想法钉在时间上，未来的我会感谢现在的我。",
      "如果你也是从第一篇开始的，欢迎一起坚持。"
    ]
  }
];

const TAGS = [
  { key: "all", label: "全部" },
  { key: "tech", label: "技术" },
  { key: "translation", label: "翻译" },
  { key: "idol", label: "偶像" },
  { key: "blog", label: "随笔" }
];

/* ================= State ================= */
let activeTag = "all";
const $ = (s) => document.querySelector(s);
const fmtDate = (d) => { const [y, m, day] = d.split("-"); return `${y} 年 ${Number(m)} 月 ${Number(day)} 日`; };

/* ================= Featured / Hero ================= */
const featured = posts[0];
function renderFeatured() {
  $("#feat-kicker").textContent = "最新 · " + featured.tagLabel;
  $("#feat-title").textContent = featured.title;
  $("#feat-excerpt").textContent = featured.excerpt;
  $("#feat-meta").innerHTML =
    `${fmtDate(featured.date)}<span class="sep">·</span>约 ${featured.minutes} 分钟阅读`;
  $("#feat-read").onclick = () => openReader(featured.id);
}

/* ================= Filter bar ================= */
function renderFilters() {
  const bar = $("#filterBar");
  bar.innerHTML = TAGS.map(t =>
    `<button class="pill${t.key === activeTag ? " active" : ""}" data-tag="${t.key}" role="tab" aria-selected="${t.key === activeTag}">${t.label}</button>`
  ).join("");
  bar.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTag = btn.dataset.tag;
      renderFilters();
      renderGrid();
    });
  });
}

/* ================= Post grid ================= */
function renderGrid() {
  const grid = $("#postGrid");
  const filtered = activeTag === "all" ? posts : posts.filter(p => p.tag === activeTag);
  $("#emptyNote").style.display = filtered.length ? "none" : "block";
  grid.innerHTML = filtered.map((p, i) => `
    <article class="tile" data-id="${p.id}" style="animation-delay:${i * 50}ms" tabindex="0" role="button" aria-label="阅读：${p.title}">
      <p class="tile-tag">${p.tagLabel}</p>
      <h3>${p.title}</h3>
      <p class="tile-excerpt">${p.excerpt}</p>
      <div class="tile-foot">
        <span class="tile-date">${fmtDate(p.date)} · 约 ${p.minutes} 分钟</span>
        <span class="tile-link">阅读全文 <span class="chev">›</span></span>
      </div>
    </article>`).join("");
  grid.querySelectorAll(".tile").forEach(tile => {
    const open = () => openReader(Number(tile.dataset.id));
    tile.addEventListener("click", open);
    tile.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
}

/* ================= Reader ================= */
function openReader(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  $("#reader-tag").textContent = p.tagLabel;
  $("#reader-title").textContent = p.title;
  $("#reader-meta").innerHTML = `${fmtDate(p.date)}<span class="sep">·</span>约 ${p.minutes} 分钟阅读`;
  $("#reader-body").innerHTML = p.body.map(t => `<p>${t}</p>`).join("");
  $("#reader").classList.add("open");
  $("#reader").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeReader() {
  $("#reader").classList.remove("open");
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });

/* ================= Init ================= */
renderFeatured();
renderFilters();
renderGrid();
</script>
</body>
</html>
